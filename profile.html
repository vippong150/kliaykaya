<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoSeller AI - โปรไฟล์</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #070a15; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { width: 100%; max-width: 420px; background: rgba(12,14,28,0.7); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.08); border-radius: 32px; padding: 40px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    h1 { font-size: 1.6rem; color: #fff; margin-bottom: 28px; font-weight: 800; letter-spacing: -0.5px; }
    .profile-item { background: rgba(255,255,255,0.04); padding: 18px; border-radius: 20px; margin-bottom: 14px; text-align: left; border: 1px solid rgba(255,255,255,0.05); }
    .label { font-size: 0.72rem; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .value { font-size: 1rem; font-weight: 600; color: #fff; }
    
    /* Modernized Points Card */
    .points-glass { background: linear-gradient(160deg, rgba(18,216,255,0.08), rgba(139,92,246,0.08)); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 30px; text-align: center; margin-top: 24px; position: relative; overflow: hidden; }
    .points-glass .plabel { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,0.4); font-weight: 600; margin-bottom: 12px; }
    .points-glass .pnum { font-size: 3.5rem; font-weight: 900; background: linear-gradient(90deg,#fff,#12d8ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; letter-spacing: -2px; margin-bottom: 4px; }
    .points-glass .punit { font-size: 0.9rem; color: rgba(255,255,255,0.3); font-weight: 500; margin-bottom: 20px; }
    
    .claim-btn { width: 100%; padding: 14px; border-radius: 16px; border: none; background: linear-gradient(135deg,#12d8ff,#8b5cf6); color: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 20px rgba(18,216,255,0.2); }
    .claim-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(18,216,255,0.4); }
    .claim-btn:disabled { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.3); cursor: not-allowed; }
    
    #timer { font-size: 1.1rem; font-weight: 700; color: #fff; margin-top: 12px; font-variant-numeric: tabular-nums; }
    
    .back-btn { margin-top: 30px; display: inline-block; padding: 12px 30px; background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.7); text-decoration: none; border-radius: 100px; font-size: 0.85rem; font-weight: 600; transition: all 0.2s; border: 1px solid rgba(255,255,255,0.1); }
    .back-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  </style>
</head>
<body>

<div class="container">
  <h1>โปรไฟล์ผู้ใช้</h1>
  <div class="profile-item">
    <div class="label">ชื่อผู้ใช้งาน</div>
    <div class="value" id="profileName">-</div>
  </div>
  <div class="profile-item">
    <div class="label">อีเมล / ไอดี</div>
    <div class="value" id="profileEmail">-</div>
  </div>
  <div class="profile-item" style="text-align:center;">
    <div class="label">🔑 Google AI Studio API Key</div>
    <div style="margin:8px 0;">
      <input type="password" id="apiKeyInput" placeholder="AIza... กรอก Key ของคุณ" style="width:100%;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.05);color:#e0e0f0;font-size:0.82rem;outline:none;font-family:inherit;">
    </div>
    <div style="display:flex;gap:8px;justify-content:center;">
      <button onclick="saveProfileKey()" style="padding:8px 18px;border-radius:100px;border:none;background:linear-gradient(135deg,#12d8ff,#8b5cf6);color:#fff;font-weight:600;font-size:0.78rem;cursor:pointer;">💾 บันทึก</button>
      <button onclick="deleteProfileKey()" style="padding:8px 18px;border-radius:100px;border:none;background:rgba(255,80,80,0.1);color:#ff6b6b;font-weight:600;font-size:0.78rem;cursor:pointer;">🗑️ ลบ</button>
    </div>
    <div id="profileKeyStatus" style="font-size:0.72rem;margin-top:6px;color:rgba(255,255,255,0.25);"></div>
  </div>
  
  <div class="points-glass">
    <div class="plabel">ยอดคงเหลือ</div>
    <div class="pnum" id="pointsNum">0</div>
    <div class="punit">พ้อย</div>
    <button class="claim-btn" id="claimBtn" onclick="claimDailyPoints()">🎁 กดรับ 50 พ้อยฟรี</button>
    <div id="timer"></div>
  </div>
  
  <a href="dashboard.html" class="back-btn">กลับสู่แดชบอร์ด</a>
</div>

<script>
  function getSession() {
    try {
      const raw = localStorage.getItem('cm_session') || sessionStorage.getItem('cm_session');
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  
  // Logic from dashboard
  function getPointsKey() { const s = getSession(); return s ? 'cm_points_' + s.user : null; }
  function getClaimKey() { const s = getSession(); return s ? 'cm_lastclaim_' + s.user : null; }
  function getPoints() {
    const k = getPointsKey(); if (!k) return 0;
    return parseInt(localStorage.getItem(k) || '0');
  }
  function setPoints(n) {
    const k = getPointsKey(); if (!k) return;
    localStorage.setItem(k, String(n));
  }
  function canClaimDaily() {
    const k = getClaimKey(); if (!k) return false;
    const lastClaim = localStorage.getItem(k);
    if (!lastClaim) return true;
    return new Date().getTime() >= parseInt(lastClaim) + (24 * 60 * 60 * 1000);
  }
  
  function refreshPointsUI() {
    const p = getPoints();
    document.getElementById('pointsNum').textContent = p.toLocaleString();
    
    const btn = document.getElementById('claimBtn');
    const timerDiv = document.getElementById('timer');
    
    const k = getClaimKey();
    const lastClaim = localStorage.getItem(k);

    if (!lastClaim || canClaimDaily()) {
      btn.disabled = false;
      btn.textContent = '🎁 กดรับ 50 พ้อยฟรี';
      timerDiv.textContent = '';
    } else {
      btn.disabled = true;
      btn.textContent = '✅ ได้รับแล้ว';
      
      const lastClaimTime = parseInt(lastClaim);
      const nextClaim = lastClaimTime + (24 * 60 * 60 * 1000);
      
      const updateTimer = () => {
        const now = new Date().getTime();
        const diff = nextClaim - now;
        
        if (diff <= 0) {
          refreshPointsUI();
          return;
        }
        
        const h = Math.floor(diff / (1000 * 60 * 60));
        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((diff % (1000 * 60)) / 1000);
        
        timerDiv.textContent = `กลับมาใหม่ใน: ${h} ชม. ${m} นาที ${s} วินาที`;
      };
      
      updateTimer();
      // Clear interval if it exists to avoid stacking
      if (window.claimInterval) clearInterval(window.claimInterval);
      window.claimInterval = setInterval(updateTimer, 1000);
    }
  }
  
  function claimDailyPoints() {
    if (!canClaimDaily()) return;
    setPoints(getPoints() + 50);
    const k = getClaimKey();
    if (k) localStorage.setItem(k, new Date().getTime());
    refreshPointsUI();
  }

  const API_HOST = localStorage.getItem('api_host') || 'http://localhost:8080';

  async function loadProfileKey() {
    const s = getSession();
    if (!s) return;
    try {
      const r = await fetch(API_HOST + '/api/user/apikey/' + encodeURIComponent(s.user), { mode: 'cors' });
      const d = await r.json();
      if (d.ok && d.hasKey) {
        document.getElementById('profileKeyStatus').textContent = '✅ มี Key: ' + d.key;
      } else {
        document.getElementById('profileKeyStatus').textContent = '⛔ ยังไม่มี Key';
      }
    } catch (e) {
      document.getElementById('profileKeyStatus').textContent = '⚠️ ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์';
    }
  }

  async function saveProfileKey() {
    const s = getSession();
    if (!s) return;
    const key = document.getElementById('apiKeyInput').value.trim();
    if (!key) { alert('⚠️ กรุณากรอก API Key'); return; }
    try {
      const r = await fetch(API_HOST + '/api/user/apikey', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user: s.user, apiKey: key }), mode: 'cors'
      });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error);
      document.getElementById('apiKeyInput').value = '';
      loadProfileKey();
      alert('✅ บันทึก API Key แล้ว');
    } catch (e) { alert('❌ ' + e.message); }
  }

  async function deleteProfileKey() {
    const s = getSession();
    if (!s) return;
    if (!confirm('ต้องการลบ API Key ที่บันทึกไว้?')) return;
    try {
      const r = await fetch(API_HOST + '/api/user/apikey/' + encodeURIComponent(s.user), { method: 'DELETE', mode: 'cors' });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error);
      document.getElementById('apiKeyInput').value = '';
      loadProfileKey();
      alert('🗑️ ลบ API Key แล้ว');
    } catch (e) { alert('❌ ' + e.message); }
  }

  const s = getSession();
  if (s) {
    document.getElementById('profileName').textContent = s.user.substring(0, 16);
    document.getElementById('profileEmail').textContent = s.user;
    if (s.user === 'vippong12000') setPoints(99999);
    refreshPointsUI();
    loadProfileKey();
  } else {
    location.href = 'index.html';
  }
</script>
</body>
</html>
